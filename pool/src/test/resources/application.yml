spring:
  application:
    name: pool
  datasource:
    url: jdbc:h2:mem:potify_pool_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

application:
  security:
    jwt:
      secret-key: test-only-jwt-secret-key-that-is-long-enough-1234567890
      expiration: 86400000
  cloudinary:
    cloud-name: test-cloud
    api-key: test-api-key
    api-secret: test-api-secret
