spring:
  application:
    name: user
  datasource:
    # Base H2 en memoire pour demarrer rapidement en local.
    url: jdbc:h2:mem:potify_user;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    # Generation automatique du schema pour la phase de developpement.
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8081
