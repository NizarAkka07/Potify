spring:
  config:
    activate:
      on-profile: h2
  datasource:
    # Base H2 en memoire pour tests d'integration et tests rapides.
    url: jdbc:h2:mem:potify;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      # En H2 de test, create-drop isole chaque execution et evite d'impacter PostgreSQL.
      ddl-auto: create-drop
