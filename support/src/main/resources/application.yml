spring:
  application:
    name: support
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/potify
    username: postgres
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8085

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:}
      expiration: 86400000
